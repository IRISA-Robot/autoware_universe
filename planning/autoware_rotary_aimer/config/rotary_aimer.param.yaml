/**:
  ros__parameters:
    # Path to the lanelet2 OSM map file containing tf_pedestrian=true ways.
    map_path: "/home/ubuntu/sim_ws/maps/map1/lanelet2_map.osm"

    # TF frames
    base_frame: "base_link"
    map_frame: "map"

    # Output topic — Float32 (rad) consumed by irisa_aio -> gama_mw PID
    output_topic: "/control/rotary_angle_cmd"

    # Rotary position feedback topic — Float32 (rad), same sign convention as output_topic.
    # Published by gama_mw_interface (real HW) and gama_hw_mock (simulation).
    # Used to seed the slew ramp on activation so the platform never jumps on enable.
    feedback_topic: "/gama/feedback/rotary"

    # Service name for enable/disable (relative to node namespace by default)
    enable_service: "~/enable"

    # Control loop rate [Hz]
    rate_hz: 10.0

    # Subtract from raw bearing if front camera is NOT aligned with platform +X axis.
    # Positive = camera is rotated CCW from +X by this many radians.
    # Default 0.0 = front camera is exactly along platform +X.
    front_cam_offset_rad: 0.0

    # If true, negate the output angle (mechanical sign flip).
    # Default false.  Set true if platform rotates in the wrong direction.
    invert_sign: false

    # If true, start the aim loop immediately at node startup (no service call needed).
    start_enabled: false

    # If true, publish 0.0 (platform back to front) when disabled.
    zero_on_disable: true

    # Number of times to repeat the 0.0 command when disabling.
    zero_repeat_count: 5

    # Interval (seconds) between repeated 0.0 commands.
    zero_repeat_period_s: 0.1

    # Laju ramp aim ke lampu [rad/s] — kecepatan sudut saat platform mengarah ke traffic light.
    # Naik = pergerakan cepat tapi kasar; turun = halus tapi lambat.
    # Nilai 0.1 rad/s (~5.7 deg/s) — 10x lebih lambat dari default lama (1.0).
    max_angle_rate_rad_s: 0.9      # 3x (2026-10-27, was 0.3); Houle driver still saturates the motor speed

    # Laju ramp balik ke 0 pas selesai/disable [rad/s] — sengaja sangat lambat biar smooth.
    # Contoh: dari 0.8 rad ke 0 butuh ~20 detik — ini disengaja agar transisi halus.
    zero_rate_rad_s: 0.12          # 3x (2026-10-27, was 0.04): 0.68 rad back to the front in ~6 s

    # ---- Mode CENTER (khusus target lampu) ----
    # MAP   : bidik bearing lampu dari base_link (perilaku lama).
    # CENTER: taruh lampu tepat di sumbu kamera (= ROI peta di tengah frame):
    #         err = atan2(y, x) lampu di center_camera_frame,
    #         target = yaw center_body_frame di base_link (sudut rotary dari encoder) + gain*err.
    #         Pemasangan kamera ikut dari TF, jadi front_cam_offset_rad tidak dipakai di mode ini.
    # Tanpa TF kamera/body (planning simulator) node tetap di MAP.
    center_enable: false
    center_camera_frame: "camera_front_link"
    center_body_frame: "body_link"
    center_enter_deg: 20.0     # MAP -> CENTER kalau lampu sudah sedekat ini ke sumbu kamera
    center_exit_deg: 30.0      # CENTER -> MAP kalau lebih jauh dari ini (histeresis)
    center_deadband_deg: 3.0   # di bawah ini target ditahan (> deadzone PID rotary 0.04 rad = 2.3 deg)
    center_gain: 1.0           # bagian error sumbu kamera yang dikoreksi

    # ---- Kamera yang dihadapkan ke lampu ----
    # Body diputar supaya kamera dengan error terkecil ke lampu yang menghadap lampu (4 kamera
    # tiap 90 deg -> body berputar maks ~45 deg).  Contoh lampu di -60 deg: kamera kanan,
    # body +30 deg.  Samakan dengan `cameras` di pedestrian_light_detector.param.yaml.
    # ["front"] = perilaku lama (selalu kamera depan).
    cameras: ["front", "left", "rear", "right"]
    camera_frame_template: "camera_{}_link"   # yaw kamera di body_frame dari TF (relatif ke front)
    body_frame: "body_link"
    camera_switch_hysteresis_deg: 15.0  # kamera yang dipakai baru diganti kalau kamera lain lebih
                                        # dekat ke lampu lebih dari ini (anti bolak-balik di 45 deg)

    # ---- Putar body hanya saat berhenti ----
    # rotate_body_while_driving: false = body hanya boleh berputar (bidik lampu DAN balik ke
    # depan) saat robot diam (|v| < stopped_speed_mps selama stopped_hold_sec); saat jalan sudut
    # ditahan.  FSM road_crossing (switch yang sama) menahan gate saat hijau sampai body kembali
    # menghadap depan, baru jalan.  Di launch di-set lewat arg road_crossing_rotate_body_while_driving.
    rotate_body_while_driving: true
    odom_topic: "/localization/kinematic_state"
    stopped_speed_mps: 0.05
    stopped_hold_sec: 0.5
    odom_timeout_sec: 1.0

    # Topik external target (geometry_msgs/PointStamped, frame map).  FSM road_crossing tidak
    # lagi mempublish ke sini (dulu centroid crossing saat approach); tetap tersedia untuk uji
    # manual.  Kalau ga ada target fresh (timeout), node membidik lampu tf_pedestrian dari OSM.
    target_topic: "~/aim_target"

    # Durasi maksimum [detik] sebuah external target dianggap masih fresh.
    # Kalau FSM berhenti publish (misal sudah lewat fase approach), target expired
    # dan node otomatis fallback ke mode lampu tf_pedestrian.
    target_fresh_sec: 0.5

    # Lampu yang dipasangkan dengan crossing aktif (PedestrianLightTarget dari FSM).
    # Mode lampu hanya mengarah ke lampu ini; sebelum FSM publish, ke lampu terdekat.
    target_light_topic: "/planning/road_crossing/target_light"
