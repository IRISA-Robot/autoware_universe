/**:
  ros__parameters:
    update_rate_hz: 10.0

    # Rollout gate.  Chosen from a launch argument so the staged deployment below can
    # be walked through without a rebuild and without editing run_aw_gama.sh again:
    #
    #   detect_only : classify and publish only.  Never touches the robot.  Safe to
    #                 leave enabled permanently in production.
    #   probe       : additionally arms the recovery costmap and measures the free
    #                 lateral corridor, and logs the decision it *would* have made.
    #   recovery    : full behaviour -- hands over to the freespace planner.
    mode: "detect_only"

    # --- stuck detection ---------------------------------------------------
    th_stopped_velocity_mps: 0.05
    # Progress is measured as displacement from the pose where SUSPECT began, not as
    # path length: a robot shuffling back and forth by 10 cm has not escaped anything
    # and must keep counting as stuck.
    unstuck_progress_m: 0.5
    # [TEST] shortened from 12.0 so the scenario can be exercised without a long wait.
    # Raise it back before running on the robot for real -- 12 s is what keeps a normal
    # traffic pause from being treated as being stuck.
    suspect_timeout_sec: 3.0
    goal_reached_dist_m: 1.0
    # A map stop (stop_line, crosswalk, ...) is legitimate -- but one that never
    # releases is pathological in its own right, so the patience is long, not infinite.
    map_stop_patience_sec: 90.0
    # Commanded to move but standing still => wheels slipping / something caught /
    # actuator interlock.  Reversing out of that is the wrong answer, so this is
    # classified before the obstacle case and routes straight to ABORT.
    # A STOP planning factor only counts as a blockage if its control point is this
    # close.  Stops a far-away obstacle_stop from being blamed when the robot happens to
    # be standing still for some other reason.
    th_stop_factor_distance_m: 3.0
    th_commanded_velocity_mps: 0.15
    mechanical_confirm_sec: 2.0

    # --- corridor sweep (shared by the PROBE precondition and the RECOVERY exit) ---
    probe_warmup_sec: 1.0
    probe_step_m: 0.25
    # Clearance added on each side of the vehicle footprint.  Threshold for the robot
    # to "fit" is vehicle_width + 2 * this, i.e. 0.78 + 0.30 = 1.08 m by default.
    lateral_margin_m: 0.15
    max_scan_half_width_m: 4.0
    # How far sideways the robot may work its way per metre travelled, used when
    # deciding whether a detour is reachable.  Offsets are measured against the path
    # and the free band drifts as the path curves, so a corridor is judged by whether
    # the robot can FOLLOW the band, not by whether one fixed offset is free the whole
    # way.  1.0 means it may move a metre sideways per metre forward.
    max_lateral_shift_per_m: 1.0
    occupancy_threshold: 50

    # --- recovery ----------------------------------------------------------
    # How far ahead the corridor question is asked, for both the PROBE precondition and
    # the RECOVERY exit test.  Deliberately local: the recovery costmap is only 20 m
    # wide, and stations beyond it would read as blocked.
    corridor_scan_distance_m: 8.0

    # Goal-candidate search along the current trajectory.  Candidates are tried from
    # min_long_distance_to_check outward, every goal_check_interval_m, up to
    # max_goal_search_distance_m -- i.e. on towards the real mission goal.  A candidate
    # that sits on the obstacle, on unmapped ground, or outside the costmap window is
    # skipped rather than fatal: astar_search rejects a colliding goal outright and
    # never retries, so one bad candidate used to kill the whole attempt.
    # Floor only.  The search actually starts just PAST the nearest blockage, whose
    # distance the corridor sweep already measures: shooting a fixed distance from the
    # robot could put the first goal on the near side of the obstacle, where freespace
    # has no reason to go around it at all.
    min_long_distance_to_check: 3.0
    goal_offset_beyond_obstacle_m: 2.0
    goal_check_interval_m: 1.0
    # A goal is only placed where the path has already been clear for this long.  Testing
    # the goal's own footprint alone accepted a pose that was free but wedged a few
    # centimetres past the obstacle it had just cleared -- no place to come to rest.
    # The search is first-fit: the first point with this much clear path behind it wins.
    goal_min_clear_length_m: 2.0
    max_goal_search_distance_m: 30.0
    # Must mirror vehicle_shape_margin_m in recovery_freespace_planner.param.yaml.  The
    # escape goal is validated against the same inflated footprint freespace will use,
    # so we never hand it a goal it rejects outright as "Invalid start or goal pose".
    goal_shape_margin_m: 0.2
    # Mirror of escape.vehicle_shape_margin_m in recovery_freespace_planner.param.yaml, same
    # convention (added to length and width, so half per side).  Freespace can plan OUT of a
    # start whose footprint is clear at this margin, so only a start blocked even at this
    # margin aborts as "start pose is inside an obstacle".  If the escape is turned off in
    # freespace, set this to vehicle_shape_margin_m there.
    escape_shape_margin_m: 0.05
    recovery_timeout_sec: 60.0
    # Hysteresis on the exit test, so a pedestrian crossing in front for half a second
    # cannot make the scenario flip back and forth.
    clear_hold_sec: 1.0

    # Recovery may only hand back once the robot has REJOINED the path.  Judging the exit
    # on "the corridor ahead is clear" alone let it hand back while the robot was still
    # standing beside the obstacle: its projection onto the path had already advanced past
    # the blockage so the sweep read clear, while lane driving -- which drives the path
    # itself -- still saw the obstacle and stopped again.  That disagreement is what made
    # the state flip between Recovery and LaneDriving forever, obstacle never passed.
    rejoin_lateral_tolerance_m: 0.5

    # --- TRANSIT: the handover state -----------------------------------------
    # Every road back to lane driving runs through TRANSIT, where the robot drives the
    # REFERENCE path at the recovery crawl until it actually points along it.
    #
    # Measured on the robot: recovery handed back at 0.067 m of lateral error -- well
    # inside the tolerance above -- while pointing 57 degrees away from the path.  Lane
    # driving then accelerated, and a robot at 57 degrees to its path leaves it: 1.41 m
    # off two seconds later.  Lateral distance alone was never enough; heading is the
    # thing that was missing.
    #
    # The gate is |wrapped(heading - path heading)| <= this, held continuously for
    # transit_hold_sec, so a robot swinging THROUGH alignment does not hand back mid-swing.
    # The lateral tolerance above still applies as well: being aimed correctly while
    # standing a metre off the path is not being back on it either.
    transit_yaw_tolerance_rad: 0.26   # 15 deg
    transit_hold_sec: 1.0
    # If it cannot line up in this long it is not going to. Stop rather than crawl forever.
    transit_timeout_sec: 30.0

    # How much of the reference path TRANSIT actually drives.  It only has to CONVERGE onto
    # the path, not travel it -- and the reference path is the lane, which runs straight
    # through the obstacle recovery just went around.  Measured live: driving 30 m of it put
    # that obstacle 6.86 m into the transit path, the drivable-area test refused the whole
    # thing, the relay published zeros, and the robot sat at 25.7 deg of heading error until
    # the state timed out.  A few metres is all the line-up needs.
    transit_lookahead_m: 5.0

    # TRANSIT drives the reference path, but it starts from wherever the robot actually
    # stands -- recovery's whole job is to have moved it off that path.  These two shape the
    # join between the two.  A plan that started on the path instead deadlocked the state
    # against its own AEB: the robot was permanently off its own plan, the AEB braked at
    # 0.60 m, the exit needed 0.50 m, and only driving could close the gap.
    transit_join_min_m: 1.5   # [m] shortest join, used when the robot is nearly on the path
    transit_join_gain: 2.5    # join length per metre of lateral offset (~22 deg approach)

    # Recovery's own emergency brake.  While this scenario drives, the
    # motion_velocity_planner stop modules are bypassed entirely, so nothing else in
    # planning is watching what the robot drives into.
    #
    # It stops for whatever the recovery costmap knows: obstacles from objects and
    # pointcloud, and the lanelet boundary itself (everything outside the road area is
    # occupied), so reversing off the road is caught as well.
    aeb_lookahead_m: 1.5
    aeb_margin_m: 0.05
    # Ignore anything closer than this: the robot is already there and the planner
    # accepted that clearance.  Without it the brake latches on the inflation around the
    # robot and it can never move at all.
    aeb_skip_ahead_m: 0.3
    # How far the robot may drift from the plan it is following before the plan stops
    # describing where it is going.  This replaced a straight-line sweep ahead of the
    # vehicle: a Reeds-Shepp escape is mostly turning, so the straight projection
    # pointed into the obstacle the manoeuvre was curving around and braked for it.
    aeb_max_deviation_m: 0.6
    # Occupancy value at which the BRAKE treats a cell as solid.  Keep this equal to
    # obstacle_threshold in recovery_freespace_planner.param.yaml.  Braking on cells the
    # planner ignores means overruling a plan it validated moments earlier on the same
    # grid -- the robot then holds against its own escape route until the episode times
    # out, which is a deadlock rather than a safety net.  The margin above is likewise
    # kept below the planner's vehicle_shape_margin_m, for the same reason.
    aeb_occupancy_threshold: 100
    # A brake held this long is not a passing hazard -- the plan is not drivable.
    # Replan instead of holding until the episode times out.
    aeb_hold_replan_sec: 3.0

    # How much of a plan may begin on ground the costmap calls blocked before the plan is
    # refused outright.  Recovery is often called precisely BECAUSE the robot has ended up
    # half off the road: its own footprint then reads blocked, and so does the first stretch
    # of any plan that digs it out.  Judging those points refuses every possible plan --
    # measured on the robot, ten goal candidates in a row were all rejected at the very same
    # coordinate, the robot's own position at 0.00 m along each plan, while the corridor
    # beside it was 3 m wide and clear.  Past this distance the plan has had its chance to
    # reach clear ground, and anything still blocked is a plan going where it must not.
    containment_grace_m: 2.0

    # Draw, in rviz, the very footprint boxes the checks above evaluate: green where the
    # test passed, amber for the opening run that containment_grace_m deliberately let
    # through, red where a box actually refused the plan.  The robot's own box and the
    # escape goal's box are drawn too, the latter with the larger margin goal placement
    # uses -- which is why a goal can be rejected on ground the brake would accept.
    # It costs almost nothing and turns "why did it brake, the obstacle was far away" into
    # something you can look at.
    publish_footprint_markers: true

    # Where the reference path comes from -- the path the corridor is swept along and the
    # escape goals are placed on.
    #
    # "centerline" rebuilds it from the lanelet map through the route handler, so it is
    # recomputed each episode and carries the prefer_lateral_ratio bias that defines where
    # in the lane this robot belongs.
    #
    # "trajectory" is the original behaviour: freeze whatever lane driving last published.
    # The trouble with that is the frozen trajectory already has an avoidance shift baked
    # into it -- the very shift that was being driven when the robot got stuck -- so the
    # corridor sweep and the goal placement end up reasoning about a path that is itself
    # part of the problem.
    #
    # Falls back to "trajectory" automatically, with a warning, while the map or route are
    # not available yet.
    reference_path_source: "centerline"
    topic_map: "/map/vector_map"
    max_lateral_excursion_m: 2.0

    # Sanity check on the recovery grid.  costmap_generator paints the whole window
    # occupied and carves the road lanelets out of it, so a real grid is mostly wall --
    # 60% occupied when measured on the robot.  A map with no subtype=road lanelets makes
    # it return early and leave the layer free EVERYWHERE, silently, and then every
    # "is this on drivable ground" test answers yes anywhere.  Below this fraction the
    # grid is treated as broken and recovery refuses to drive rather than trusting it.
    min_occupied_fraction: 0.05

    # Legs against the mission -- backing up, in a forward mission -- planned by freespace.
    #
    # This is NOT the old BACKOFF.  BACKOFF was the supervisor's own blind retreat along the
    # path it came from, for as long as the obstacle kept coming.  Here a leg against the
    # mission is only ever driven as part of a freespace plan the supervisor has seen WHOLE,
    # every cusp of it (/planning/recovery/freespace_full_trajectory), and only if:
    #   - the plan ENDS travelling the mission's way (a three-point turn, never a retreat),
    #   - it changes direction at most max_direction_changes times,
    #   - every leg is >= min_leg_length_m, or the robot stalls at the cusp,
    #   - its legs against the mission total <= max_counter_mission_per_plan_m, and
    #   - that, plus the ground already given up this episode, fits in max_ground_given_m.
    # The plan is judged once, when it appears, and refused whole or not at all.
    #
    # max_ground_given_m is measured along the reference path from the furthest point the
    # robot has reached this episode, so driving on pays it back.  It is what bounds "the
    # obstacle closes in and the robot keeps giving ground", which is possible again now.
    # false = the strict rule: every freespace segment must travel with the mission.
    allow_counter_mission_legs: true
    max_direction_changes: 2               # forward-back-forward
    # pid_longitudinal_controller leaves STOPPED on stop_dist > drive_state_stop_dist
    # (0.5 m); the 1.5 m sum is only its STOPPING-state test.  At a cusp the robot is
    # STOPPED, so a 1.0 m leg should start.  A* backs up exactly 1.0 m in the cases seen so
    # far (2026-09-24, live grid: back 1.0 m, forward 4.6 m), and 1.5 refused every one.
    # If the robot is seen standing at a cusp without starting the next leg, the controller
    # disagrees -- raise this and astar.min_leg_length_m in the freespace profile together.
    # [2026-09-24, second pass] The departure distance was never the limit -- the STOPPING
    # state is.  pid_longitudinal_controller goes DRIVE -> STOPPING the moment stop_dist <
    # stopping_state_stop_dist (1.0 m), moving or not, and a robot standing still in STOPPING
    # is held there until stop_dist > drive_state_stop_dist + offset (1.5 m).  So a leg of
    # 1.0 m or less can never be started from rest: measured, CONTROL_STATE = STOPPING with
    # STOP_DIST 0.83 m and a -0.25 m/s target, command 0.00, for a whole episode.  A leg has to
    # be longer than stopping_state_stop_dist, with room to get moving before it: 1.5 m.
    min_leg_length_m: 1.5                  # clamped to [0.5, 5]
    max_counter_mission_per_plan_m: 3.0    # clamped to [0, 5]
    max_ground_given_m: 4.0                # clamped to [0, 6]

    # Hard ceiling for everything this scenario drives.  Enforced in the supervisor's
    # relay, which is the single publisher of the recovery trajectory, so nothing
    # downstream can raise it.
    recovery_speed_limit_mps: 0.278   # 1 km/h

    # How long to wait for a usable plan before trying the next goal candidate.  When the
    # candidates run out the robot stops and waits for an operator -- it does not give
    # ground to buy itself a better starting position.
    goal_retry_sec: 2.0   # [TEST] shortened from 4.0

    # Shortest distance to the plan's next stop point that the longitudinal controller
    # will still engage on.  MUST be >= the controller's own DRIVE entry distance:
    # pid.param.yaml drive_state_stop_dist (0.5) + drive_state_offset_stop_dist (1.0)
    # = 1.5 m.  It was 0.3, which opened a dead band between 0.3 m and 1.5 m where the
    # controller refuses to leave STOPPED but this node still calls the plan drivable --
    # so nothing replans and the episode runs out its 60 s timeout with the robot
    # standing still.  Freespace splits its plan at every direction cusp with a
    # zero-velocity point, so short segments are normal in a Reeds-Shepp escape and land
    # in that band easily.  If the controller values change, change this one with them.
    #
    # [2026-09-24] 1.5 -> 0.5.  The stalls this was sized on were the controller, not a
    # departure distance: smooth_stop_max_strong_acc (-1.5) braked the 0.278 m/s crawl to a
    # halt within centimetres of entering STOPPING, and the robot then crept on in hops until
    # it was within drive_state_stop_dist (0.5 m) of the stop point, where it stayed.  With
    # that fixed in pid.param.yaml (-0.05, and drive_state_stop_dist 0.2) the controller sets
    # off for anything beyond 0.2 m.
    #
    # [2026-09-24, second pass] 0.5 -> 1.1.  "Sets off for anything beyond 0.2 m" was wrong:
    # from rest, the controller drops into STOPPING for any stop point closer than
    # stopping_state_stop_dist (1.0 m) and never leaves it.  So a plan whose next stop is
    # nearer than that IS spent for a standing robot, and this has to sit just above 1.0.
    # Keep it below min_leg_length_m (1.5), or the start of every leg reads as spent.
    min_engageable_stop_distance_m: 1.1

    # Forced replan.  When the robot stops past the live part of freespace's plan, the
    # nearest trajectory point to it already has zero velocity: the smoother then reads
    # target_vel = 0 and will never restart it, while freespace sees no reason to replan
    # (its trajectory is not empty, no obstacle is on the remaining path, and the robot
    # is still well within th_course_out_distance_m).  Re-publishing the route makes it
    # reset and plan afresh from where the robot actually is.
    replan_wait_sec: 5.0        # freespace only plans once the vehicle has stopped
    max_replan_attempts: 3      # then move on to the next goal candidate
    # The plan must look spent for this long, continuously, before a replan is forced.
    # Judging it instantly produced a RECOVERY <-> REPLAN oscillation: a single short
    # partial from freespace was enough to trigger a forced replan, and that republishes
    # the route -- which makes freespace reset() and discard the plan it had just made.
    spent_hold_sec: 2.0
    # A freespace plan is only acted on if it arrived AFTER this episode's goal was
    # published, and within this long.  /planning/recovery/route has to be
    # transient_local (freespace subscribes latched), so a goal from a previous episode
    # survives on the topic and freespace can answer it the instant it is re-armed --
    # relaying that answer once sent the robot off to a previous scenario's goal.
    freespace_plan_timeout_sec: 1.0

    # The recovery costmap must be FRESH, not merely present.  Keeping the last grid
    # received meant that when the recovery container died (freespace_planner crashed on
    # an empty partial_trajectory_), the supervisor carried on sweeping a frozen snapshot
    # -- reporting an unchanging clear corridor and leaving RECOVERY after one second,
    # with nothing to suggest the planner was gone.
    costmap_timeout_sec: 1.0

    # --- budget ------------------------------------------------------------
    max_attempts: 2
    # How long COOLDOWN lasts after an episode ends, handed back or given up.
    # [2026-09-24] 3.0 -> 1.0, and there is no ABORT state any more: every "give up" goes
    # straight to COOLDOWN, then NOMINAL, and the next episode starts from nothing -- fresh
    # PROBE, fresh goals, fresh plans.  That replaced ABORT's release rules, shadow
    # replanning and retry budget (abort_release_sec, abort_shadow_replan_sec,
    # abort_reentry_hold_sec, abort_retry_sec, max_abort_retries -- all removed).  A new
    # episode still has to pass SUSPECT (suspect_timeout_sec) first, which is what keeps
    # the retries from spinning.  A mechanical stall no longer latches either.
    cooldown_sec: 1.0
    # How long BLOCKED waits before re-measuring the corridor.  It used to borrow
    # cooldown_sec; at 1 s that would bounce BLOCKED <-> PROBE every second.
    blocked_retry_sec: 60.0
    max_episode_duration_sec: 180.0

    # [UNKNOWN-STOP 2026-09-16] A stop that no Autoware planning factor claims used to
    # leave SUSPECT with no exit at all -- not triggerable, not legitimate, so it waited
    # for ever (caught live at 83 s).  Now SUSPECT measures for itself with the recovery
    # costmap instead of trusting a classification that already failed:
    #   corridor blocked -> actionable, go to PROBE (nothing in planning claimed it, which
    #                       is exactly the case this module exists for)
    #   corridor clear for this long -> nothing to recover from, hand back to lane driving
    # The hold is on the CLEAR side only: releasing a robot that is genuinely boxed in is
    # the expensive mistake, so that direction must be sustained, while a blockage is acted
    # on as soon as it is seen.
    unknown_stop_clear_hold_sec: 3.0
    # Releasing an unexplained-but-clear stop is right; releasing it for ever is not.  The
    # release used to go straight to NOMINAL -- the one path in this node that skipped
    # COOLDOWN -- so the still-stationary robot was re-detected on the next tick and the
    # cycle repeated every 12 s indefinitely (measured: episode 164 -> 174 in two minutes,
    # robot frozen throughout).  After this many releases with no motion at all, the node
    # holds and says so.  The budget resets the moment the robot moves.
    max_unknown_releases: 3

    # --- stop attribution --------------------------------------------------
    # Planning factor topic suffixes; the node subscribes to
    # /planning/planning_factors/<name> for each (see planning_factor_interface.hpp).
    # Verify the live list once on the robot with:
    #   ros2 topic list | grep planning_factors
    # [FACTOR-COVERAGE 2026-09-16] 37 planning-factor topics are live on this stack; this
    # node used to subscribe to 12.  A STOP published on any of the other 25 arrived as
    # SOURCE_UNKNOWN with an EMPTY stop_source_module, which reads as "nobody knows why the
    # robot stopped" when in fact the module said so plainly on a topic nothing was
    # listening to.  Caught live: static_obstacle_avoidance publishing
    # behavior=STOP distance=0.80 while the supervisor reported an unexplained stop and
    # cycled SUSPECT->NOMINAL every 12 s for minutes.
    #
    # Pathological = a blockage lane driving cannot get past on its own, so recovery should
    # look.  static_obstacle_avoidance belongs here because it publishes its yield STOP
    # exactly when it has concluded an object cannot be avoided -- lane driving giving up is
    # the definition of this module's case.
    pathological_factor_topics:
      - "obstacle_stop"
      - "dynamic_obstacle_stop"
      - "run_out"
      - "road_user_stop"
      - "out_of_lane"
      - "boundary_departure_prevention"
      - "static_obstacle_avoidance"
      - "avoidance_by_lane_change"
      - "dynamic_obstacle_avoidance"
      - "surround_obstacle_checker"
      - "no_drivable_lane"
      - "obstacle_cruise"
      - "obstacle_cruise_planner"
      - "obstacle_stop_planner"
    # Legit = a deliberate hold.  Recovery must never manoeuvre around a stop line, a
    # pedestrian crossing, a traffic light, or a collision check that is doing its job.
    # goal_planner and start_planner are here because stopping at the goal or before pulling
    # out is the mission working, not a blockage.
    legit_factor_topics:
      - "stop_line"
      - "crosswalk"
      - "walkway"
      - "detection_area"
      - "virtual_traffic_light"
      - "road_crossing"
      - "traffic_light"
      - "intersection"
      - "blind_spot"
      - "merge_from_private"
      - "no_stopping_area"
      - "occlusion_spot"
      - "roundabout"
      - "goal_planner"
      - "start_planner"
      - "lane_change_left"
      - "lane_change_right"
      - "rear_collision_checker"
      - "intersection_collision_checker"

    # road_crossing FSM states that mean "it is deliberately holding":
    # ARMED_CROSSWALK(1), REROUTING_TO_ALT(3), ARMED_LIGHT(4), WAIT_GREEN(5),
    # REROUTING_TO_GOAL(8).  That FSM has its own watchdog -- never compete with it.
    road_crossing_hold_states: [1, 3, 4, 5, 8]

    # --- topics ------------------------------------------------------------
    topic_odometry: "/localization/kinematic_state"
    topic_velocity_status: "/vehicle/status/velocity_status"
    topic_control_cmd: "/control/command/control_cmd"
    topic_trajectory: "/planning/scenario_planning/trajectory"
    topic_route: "/planning/mission_planning/route"
    topic_route_state: "/api/routing/state"
    topic_operation_mode: "/api/operation_mode/state"
    topic_control_mode: "/vehicle/status/control_mode"
    topic_gear: "/vehicle/status/gear_status"
    topic_scenario: "/planning/scenario_planning/scenario"
    topic_occupancy_grid: "/planning/recovery/costmap_generator/occupancy_grid"
    topic_recovery_trajectory: "/planning/recovery/trajectory"
    # freespace publishes here; the supervisor is the single publisher on
    # topic_out_recovery_trajectory, relaying freespace's plan verbatim.
    topic_freespace_trajectory: "/planning/recovery/freespace_trajectory"
    # The whole plan the segment above was cut from.  Judged before the first leg moves.
    topic_freespace_full_trajectory: "/planning/recovery/freespace_full_trajectory"
    topic_recovery_is_completed: "/planning/recovery/is_completed"
    topic_road_crossing_state: "/planning/road_crossing/fsm_state"
    topic_emergency_code: "/gama/mw/emergency_code"
    topic_robot_fsm: "/robot_fsm"

    topic_out_scenario: "/planning/recovery/scenario"
    topic_out_route: "/planning/recovery/route"
    topic_out_force_recovery: "/planning/recovery/force_recovery"
    topic_out_state: "/planning/stuck_recovery/state"
    topic_out_state_int: "/planning/stuck_recovery/state_int"
    topic_out_diagnosis: "/planning/stuck_recovery/diagnosis"
    topic_out_markers: "/planning/stuck_recovery/debug/markers"
    topic_out_escape_goal: "/planning/stuck_recovery/debug/escape_goal"
    topic_out_recovery_trajectory: "/planning/recovery/trajectory"
    service_force_recovery: "/planning/stuck_recovery/force_recovery"
