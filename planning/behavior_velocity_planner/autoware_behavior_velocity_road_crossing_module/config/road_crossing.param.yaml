/**:
  ros__parameters:
    road_crossing:
      # State machine
      stop_distance_threshold: 5.0      # [m] APPROACHING → STOPPING when ego is within this of stop_line
      stop_arrival_threshold: 0.2       # [m] STOPPING → CHECKING when ego is this close to stop_line
      stop_state_speed: 0.05            # [m/s] "ego stopped" threshold
      sustained_clear_sec: 1.5          # [s] hysteresis: stay clear this long before releasing
      timeout_sec: 30.0                 # [s] after this much waiting, log WARN

      # Vehicle check ("can this vehicle still stop?").  The gate (traffic light) applies either way.
      #   enable: false -> never stop for vehicles here; only the gate holds the robot, and
      #                    obstacle_stop handles anything actually in its way.
      #   enable: true  -> checked continuously while approaching and crossing.  A vehicle is a danger
      #                    only if it can no longer stop before the robot's path (v^2 / 2a >= distance -
      #                    distance_margin) and would arrive before the robot is through (+ time_margin),
      #                    or it is within min_distance of the robot's path.  The robot then stops at the
      #                    line, or mid-way just before that vehicle's lane -- never inside it.
      vehicle_check:
        enable: false
        stop_deceleration: 3.0   # [m/s^2] braking a vehicle is assumed to be able to apply
        distance_margin: 3.0     # [m] it must be able to stop this much before the robot's path
        time_margin: 2.0         # [s] it must arrive this much after the robot is through
        min_distance: 3.0        # [m] this close to the robot's path: always a danger
        min_speed: 0.5           # [m/s] slower counts as standing
        lateral_margin: 0.5      # [m] added to the robot's half width for its path
        stop_debounce_sec: 0.5   # [s] danger this long before the robot stops mid-way (hold-to-go uses sustained_clear_sec)
      min_confidence: 0.5               # [-] drop predicted_paths below this confidence
      crossing_speed_for_horizon: 0.833 # [m/s] robot speed assumed through the crossing when it is slower (≈3 km/h)

      # Object class filter — the labels the vehicle check looks at.
      # ObjectClassification enum: UNKNOWN=0 CAR=1 TRUCK=2 BUS=3 TRAILER=4 MOTORCYCLE=5 BICYCLE=6 PEDESTRIAN=7
      # Per design: vehicles only (we cross alongside pedestrians/bicycles)
      block_on_car: true
      block_on_truck: true
      block_on_bus: true
      block_on_trailer: true
      block_on_motorcycle: true
      block_on_bicycle: false
      block_on_pedestrian: false
      block_on_unknown: true  # true: perception platform ini output UNKNOWN untuk semua object, jadi harus block UNKNOWN supaya stop berfungsi
      stop_margin: 0.5        # [m] jarak stop sebelum stop_line untuk instance ROAD — wiring field PlannerParam::stop_margin
      # TIDAK DIPAKAI LAGI: stop sebelum pre_road_crossing dihapus (dulu untuk deteksi crosswalk).
      pre_stop_dist_m: 2.0    # [tuned] 1.0→2.0: robot stop 2m sebelum pre (buffer lebih besar dari residual gerak/localization jitter; tetap di parent/fork buat reroute alternate). [m] jarak fisik bagian depan robot ke entry polygon pre_road_crossing. Robot berhenti di parent lanelet (titik fork) supaya reroute ke alternate masih bisa dilakukan. (Hanya berlaku untuk instance PRE; instance ROAD tetap pakai stop_margin.)

      # FSM gate integration
      # require_fsm_gate: false → original behaviour (backward compatible).
      # require_fsm_gate: true  → CHECKING → CROSSING only when FSM gate == GO.
      require_fsm_gate: true  # [phase2-test] true: aktifkan dua gated-stop (pre + road). WAJIB jalankan road_crossing_v2.launch.xml (FSM node), kalau tidak robot nyangkut di stop nunggu gate.
      gate_topic: "/planning/road_crossing/gate"
      # [ROAD, hijau] tunggu maksimal N detik kalau predicted-path kendaraan nge-block sebelum nyebrang anyway;
      # 0.0 = langsung nyebrang pas hijau; besar = nunggu kendaraan clear lebih lama.
      green_block_timeout_sec: 2.0
      # Tidak ada watchdog yang memaksa CROSSING selama gate HOLD: lampu merah bisa ~60 s.
      # Gate lebih tua dari ini = HOLD. FSM publish gate crossing aktif tiap tick (10 Hz);
      # gate lama dari episode sebelumnya (atau FSM mati) tidak boleh melepas robot.
      gate_stale_sec: 0.5
