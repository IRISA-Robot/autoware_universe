/**:
  ros__parameters:
    # -------------------------------------------------------------------
    # Timer rate
    # -------------------------------------------------------------------
    update_rate_hz: 10.0                # [Hz] FSM tick frequency

    # -------------------------------------------------------------------
    # IDLE → APPROACH_PRE trigger
    # -------------------------------------------------------------------
    # Episode mulai hanya saat base_link di lanelet tepat sebelum road_crossing (pre) dan berakhir/reset
    # begitu robot tidak di pre/crossing aktif (arm_hops_max dihapus).

    # -------------------------------------------------------------------
    # Interlock lampu hijau di WAIT_GREEN (interlock.plan.md). Satuan: TICK FSM
    # (1 tick = 1/update_rate_hz = 0.1 s). Dihitung dari pesan lampu PASANGAN crossing:
    # RED = merah terdeteksi; GREEN / COUNTDOWN_GREEN = hijau terdeteksi; NONE/BLANK = tidak.
    #   Rule 1: status MERAH lalu HIJAU            → GO (awal fase hijau, pasti solid)
    #   Rule 2: HIJAU terus >= hijau_solid tick    → GO (tanpa merah sebelumnya)
    # GO boleh di mana saja di pre (tidak menunggu dekat garis); robot lalu menyeberang tanpa
    # berhenti di garis stop.
    # Tidak ada timeout: tanpa izin interlock robot HOLD selamanya.
    #
    # Lampu standar di sini: hijau 15 s, hijau kedip 10 s (~0.5 s nyala / 0.5 s padam),
    # merah ~60 s, merah kedip jarang. Aturan tuning:
    #   hijau_off   < fase padam kedip (5 tick)  — supaya kedip memutus counter hijau,
    #               > putus deteksi sesaat di hijau solid.
    #   hijau_solid > fase nyala kedip (5 tick)  — satu nyala kedip tidak cukup untuk GO,
    #               (20 tick = 2 s: margin 4x; pre terpendek 3.4 m jadi tidak perlu menunggu)
    #               < hijau solid (150 tick)     — kalau datang telat > hijau_solid sebelum
    #                 kedip, tunggu siklus berikutnya.
    #   merah_off   > celah deteksi saat merah → hijau + hijau_valid — supaya status
    #                 langsung MERAH → HIJAU (Rule 1), tidak lewat NONE.
    # -------------------------------------------------------------------
    threshold_merah_valid: 3            # [tick] merah terdeteksi >= ini → status_merah_valid
    threshold_hijau_valid: 3            # [tick] hijau terdeteksi >= ini → status_hijau_valid
    threshold_merah_off: 10             # [tick] merah hilang >= ini → counter merah = 0
    threshold_hijau_off: 3              # [tick] hijau hilang >= ini → counter hijau = 0
    threshold_interlock_hijau_solid: 20 # [tick] hijau terus >= ini → hijau solid (Rule 2)

    # -------------------------------------------------------------------
    # Re-route to alternate crossing (two-phase reroute)
    # Phase A (REROUTING_TO_ALT): send robot to nearest alternate_road_crossing lanelet.
    # Phase B (REROUTING_TO_GOAL): restore original goal once ego has left the pre stop.
    # -------------------------------------------------------------------
    reroute_enabled: true               # if false, skip REROUTING_TO_ALT and fall through to ARMED_LIGHT
    reroute_cooldown_sec: 60.0          # [s] minimum interval between re-routes (prevents rapid retries)
    reroute_min_time_sec: 5.0           # [s] minimum elapsed time in REROUTING_TO_ALT step3 (robot
                                        #     moving toward alternate) before transitioning to
                                        #     REROUTING_TO_GOAL.  Prevents immediate snap-back when
                                        #     the route changes but the robot hasn't physically moved yet.
    reroute_min_dist_m: 5.0             # [m] minimum distance ego must have moved from the pre entry
                                        #     before transitioning to REROUTING_TO_GOAL.  Measured by
                                        #     distanceToPreEntry() (grows as ego moves away from pre).
                                        #     If active_pre_id_ is null (no pre lanelet), this gate
                                        #     is bypassed and only reroute_min_time_sec applies.
    engage_retry_sec: 2.0               # [s] minimum interval between change_to_autonomous retry calls
                                        #     in reroute step-2.  Engage is retried periodically until
                                        #     operation mode is confirmed AUTONOMOUS (mode==2).
                                        #     Prevents spamming the service every 0.1 s tick.

    # -------------------------------------------------------------------
    # Topic / service names (defaults match the interface contract)
    # -------------------------------------------------------------------
    topic_pedestrian_light:      "/perception/road_crossing/pedestrian_light"
    topic_gate:                  "/planning/road_crossing/gate"
    topic_fsm_state:             "/planning/road_crossing/fsm_state"
    topic_light_status:          "/planning/road_crossing/light_status"   # interlock status_now: 0 NONE, 1 MERAH, 2 HIJAU
    topic_route:                 "/planning/mission_planning/route"
    topic_map:                   "/map/vector_map"
    topic_ego_pose:              "/localization/kinematic_state"
    srv_ped_light_detector:      "/perception/road_crossing/pedestrian_light_detector/enable"
    srv_rotary_aimer:            "/rotary_aimer/enable"

    # -------------------------------------------------------------------
    # Rotary aimer spam-enable
    # Kirim enable berulang ke rotary_aimer setiap aim_enable_retry_sec selama FSM menunggu
    # (APPROACH_PRE .. WAIT_GREEN), crossing punya lampu, dan ego di pre (base_link ATAU
    # bumper depan) atau dalam aim_approach_dist_m dari pre entry -- selama aimer belum
    # publishing (cmd stale).  Aimer selalu membidik lampu target (target_light).
    # Berhenti spam setelah aimer publish pesan (cmd fresh → running confirmed).
    # -------------------------------------------------------------------
    topic_rotary_angle_cmd:  "/control/rotary_angle_cmd"
                                        # Topik output rotary aimer (std_msgs/Float32).
                                        # Dipakai untuk deteksi apakah aimer sudah running.
    aim_cmd_fresh_sec:       0.5        # [s] pesan aim_cmd dianggap fresh jika lebih muda dari ini.
                                        # Jika fresh → aimer running → spam enable berhenti.
    aim_enable_retry_sec:    0.3        # [s] interval minimum antar kiriman enable ke rotary_aimer.
                                        # Cukup sering agar enable tidak missed, tidak terlalu padat.

    aim_approach_dist_m:  10.0          # [m] jarak dari pre entry di mana aimer mulai diaktifkan
                                        # dan membidik lampu (sebelum robot tiba di pre).
    topic_target_light:  "/planning/road_crossing/target_light"
                                        # PedestrianLightTarget: lampu pasangan crossing aktif,
                                        # dari tag forward_pedestrian_tf (reverse_pedestrian_tf
                                        # nanti). Detector, aimer dan simulator mengikuti ini.
                                        # Crossing tanpa tag = tanpa lampu → langsung GO.

    # -------------------------------------------------------------------
    # Position gates (mencegah FSM maju sebelum robot tiba di lokasi)
    # Memperbaiki bug: FSM balapan ke CROSSING saat robot masih di start (jauh dari crossing).
    # -------------------------------------------------------------------
    pre_arrive_dist_m:       5.0        # [m] ego dianggap "sudah di pre" jika distanceToPreEntry()
                                        #     berada di rentang [0, pre_arrive_dist_m].
                                        #     Harus >= pre_stop_dist_m (≈2.0 m) agar gate aktif
                                        #     saat robot sudah berhenti di pre-stop.
                                        #     Gate APPROACH_PRE: tahan sampai at_pre = true.
    crossing_arrive_dist_m:  3.0        # [m] ego dianggap "sudah di crossing" jika
                                        #     distanceToCrossingEntry() berada di [0, crossing_arrive_dist_m].
                                        #     Gate WAIT_GREEN: tahan sampai at_crossing = true.
    relocalize_jump_m:       2.0        # [m] ego berpindah > ini dalam 1 tick FSM (0.1 s) = relokalisasi
                                        #     (2D Pose Estimate / lompatan lokalisasi) → reset episode
                                        #     & suppression, pilih ulang crossing dari posisi baru.

    # -------------------------------------------------------------------
    # Safety-timeout watchdogs (defensive, additive — do not gate normal-path exits)
    # -------------------------------------------------------------------
    crossing_timeout_sec:        60.0   # [s] CROSSING (state 6) safety timeout. Its only normal
                                        #     exit is egoPastCrossingExit() (centerline-projection
                                        #     check), which can permanently fail to fire if
                                        #     is_driving_forward_ flips near/inside the crossing
                                        #     lanelet (bidirectional-driving reverse scenario).
                                        #     If exceeded, forces the same cleanup as the normal
                                        #     exit (DONE + GO gates + disable detectors), logged
                                        #     as a distinct safety-timeout-forced exit.
    engage_timeout_sec:          30.0   # [s] REROUTING_TO_ALT/REROUTING_TO_GOAL step2 absolute
                                        #     timeout waiting for autonomous_available while
                                        #     retrying change_to_autonomous at engage_retry_sec
                                        #     cadence. If exceeded, abandons the reroute attempt
                                        #     (resetEpisode + IDLE) instead of retrying forever.
